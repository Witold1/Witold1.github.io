<!DOCTYPE html>

<!--
  Theme options (dropdown; persisted in localStorage as witold1-theme):
  - auto (local time):
      06–11 Galaxy (morning)
      11–17 Winter in Dec–Feb daytime, else Galaxy
      17–21 Polygon (evening)
      21–06 Stargazer (night)
  - stargazer / winter / galaxy / polygon: manual overrides
-->

<html class="theme-stargazer" lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Witold1 — Portfolio &amp; Links</title>
    <link rel="icon" type="image/png" href="images/avatar.png">

    <meta name="description" content="Witold1 — research, visualization, analytics, sales. Portfolio, GitHub, and LinkedIn.">
    <link rel="canonical" href="https://witold1.github.io/">
    <meta name="author" content="Witold1">

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Witold1">
    <meta property="og:description" content="Research, visualization, analytics, sales">
    <meta property="og:url" content="https://witold1.github.io/">
    <meta property="og:image" content="https://witold1.github.io/images/avatar@2x.png">
    <meta name="twitter:card" content="summary">

    <script data-goatcounter="https://witold1.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>

    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-800.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">
    <link rel="stylesheet" href="css/themes/theme-chrome.css">
    <link rel="stylesheet" href="css/themes/stargazer.css">
    <link rel="stylesheet" href="css/themes/winter-wonderland.css">
    <link rel="stylesheet" href="css/themes/galaxy.css">
    <link rel="stylesheet" href="css/themes/polygon.css">
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("witold1-theme");
          if (pref === "default" || pref === null) pref = "auto";
          var theme = pref;
          var manual = { stargazer: 1, winter: 1, galaxy: 1, polygon: 1 };
          if (!manual[pref]) {
            var d = new Date();
            var h = d.getHours();
            var winter = d.getMonth() === 11 || d.getMonth() === 0 || d.getMonth() === 1;
            if (h >= 21 || h < 6) theme = "stargazer";
            else if (h < 11) theme = "galaxy";
            else if (h < 17) theme = winter ? "winter" : "galaxy";
            else theme = "polygon";
          }
          document.documentElement.className = "theme-" + theme;
        } catch (e) {}
      })();
    </script>
    <script src="js/polygon.js" defer></script>
    <script src="js/theme.js" defer></script>
  </head>

<body>

    <div class="theme-fx theme-fx--stargazer" aria-hidden="true">
      <div class="parallax-background">
        <div class="object1"></div>
      </div>
    </div>

    <div class="theme-fx theme-fx--winter" aria-hidden="true">
      <div class="parallax-background"></div>
    </div>

    <div class="theme-fx theme-fx--galaxy" aria-hidden="true">
      <div class="galaxy-layer galaxy-layer--1"></div>
      <div class="galaxy-layer galaxy-layer--2"></div>
      <div class="galaxy-layer galaxy-layer--3"></div>
    </div>

    <div class="theme-fx theme-fx--polygon" aria-hidden="true"></div>

    <div class="container">
        <div class="column">
          <main>

            <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="Witold1" width="128" height="128" fetchpriority="high">

            <h1>Witold1</h1>

            <p>Research, visualization, analytics, sales</p>

            <nav class="button-stack" aria-label="Links">

              <!-- Portfolio (separate GitHub Pages project) -->
              <a class="button button-default" href="https://witold1.github.io/portfolio/" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-blog.svg" alt="">Portfolio</a>

              <!-- GitHub -->
              <a class="button button-github" href="https://github.com/Witold1" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/github.svg" alt="">GitHub</a>

              <!-- LinkedIn -->
              <a class="button button-linked" href="https://www.linkedin.com/in/vital-yevtushenko" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/linkedin.svg" alt="">LinkedIn</a>

            </nav>
          </main>

          <footer>
            <a href="privacy.html">Privacy Policy</a> | Built with <a href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a><br>
            Themes adapted from <a href="https://github.com/LinkStackOrg/stargazer" target="_blank" rel="noopener">Stargazer</a>, <a href="https://github.com/LinkStackOrg/galaxy" target="_blank" rel="noopener">Galaxy</a>, <a href="https://github.com/LinkStackOrg/polygon" target="_blank" rel="noopener">Polygon</a>, <a href="https://github.com/LinkStackOrg/winter-wonderland" target="_blank" rel="noopener">Winter Wonderland</a>
          </footer>

        </div>
      </div>

    <div class="theme-picker">
      <label for="theme-select">Theme</label>
      <select id="theme-select" name="theme">
        <option value="auto" selected>Auto</option>
        <option value="stargazer">Stargazer</option>
        <option value="galaxy">Galaxy</option>
        <option value="polygon">Polygon</option>
        <option value="winter">Winter</option>
      </select>
    </div>

</body>

</html>
